spring.application.name=evaluacion-service-grupo07
server.port=8084

# ---------- Cliente del Config Server (perfil dev, repositorio de Riesgos) ----------
spring.profiles.active=dev
# Nombre del archivo en GitHub: evaluacion-service-dev.properties (patron evaluacion-*)
spring.cloud.config.name=evaluacion-service
spring.config.import=configserver:http://localhost:8888

# ---------- Registro en Eureka ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# Evita que /actuator/refresh recree el cliente Eureka (bug NPE "key is null" en eureka-client 2.0.x)
eureka.client.refresh.enable=false

# ---------- Actuator: recarga en caliente ----------
management.endpoints.web.exposure.include=refresh,health,info
